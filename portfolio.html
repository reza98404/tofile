/* ============================================================
   Tokens — values from the theme panel arrive on :root as
   --p (primary) --a (accent) --tx (text) --fs (font scale) --rs (radius scale)
   ============================================================ */
:root{
  --p:#12305B; --a:#2F6FB5; --tx:#4B5563; --on-accent:#fff; --fs:1; --rs:1;
  --navy:var(--p); --blue:var(--a);
  --navy-900:color-mix(in srgb,var(--p) 78%,#000);
  --blue-100:color-mix(in srgb,var(--a) 12%,#fff);
  --blue-200:color-mix(in srgb,var(--a) 26%,#fff);
  --sky:color-mix(in srgb,var(--a) 55%,#fff);
  --heading:var(--p);
  --ink:#1B2430; --text:var(--tx); --muted:#6B7280; --line:#E2E7EF; --page:#EEF2F7; --paper:#fff; --card:#fff; --soft:#EEF2F7;
  --panel-navy:var(--p); --on-navy:#fff; --on-navy-soft:rgba(255,255,255,.78); --navy-cell:rgba(255,255,255,.08);
  --btn-navy-bg:var(--p); --btn-navy-fg:#fff;
  --r-xl:calc(28px*var(--rs)); --r-lg:calc(20px*var(--rs)); --r:calc(14px*var(--rs)); --r-sm:calc(10px*var(--rs));
  --wrap:1200px; --shadow:0 10px 30px -18px rgba(18,48,91,.3);
  --ease:cubic-bezier(.2,.7,.2,1);
  --spbar-h:3px;
}
html.dark{
  --heading:#EAF0F8; --ink:#E6EBF3; --text:#B7C2D3; --muted:#8F9DB3; --line:#24344F; --page:#0A1220; --paper:#111E33; --card:#111E33; --soft:#182845;
  --blue-100:rgba(143,184,232,.14); --blue-200:rgba(143,184,232,.26); --sky:#9FC3EE;
  --panel-navy:#15294A; --on-navy:#fff; --on-navy-soft:rgba(255,255,255,.72); --navy-cell:rgba(255,255,255,.07);
  --btn-navy-bg:var(--a); --btn-navy-fg:#fff;
  --shadow:0 10px 30px -18px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:100px}
#app{display:flow-root}
html.smooth{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;font-size:calc(16px*var(--fs));-webkit-font-smoothing:antialiased;overflow-x:clip;transition:background-color .3s,color .3s}
body.font-system{font-family:system-ui,"Segoe UI",Tahoma,sans-serif}
body.font-custom{font-family:var(--ufont),"Vazirmatn",Tahoma,sans-serif}
img,video{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:6px}
::selection{background:var(--blue);color:var(--on-accent)}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:20px}
.sec{padding-block:18px}
.hidden{display:none!important}
.panel{background:var(--card);border-radius:var(--r-xl);padding:56px;transition:background-color .3s}
.panel.navy{background:var(--panel-navy);color:var(--on-navy)}
.h1{font-size:2.6em;line-height:1.45;font-weight:800;color:var(--heading)}
.h2{font-size:2.1em;line-height:1.5;font-weight:800;color:var(--heading)}
.navy .h1,.navy .h2{color:#fff}
.center{text-align:center}
.center .lead{margin-inline:auto}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:.85em;font-weight:700;color:var(--blue);background:var(--blue-100);padding:7px 14px;border-radius:999px;width:max-content}
.navy .pill{color:#fff;background:rgba(255,255,255,.12)}
.lead{font-size:1.06em;line-height:1.95;color:var(--text);max-width:40em}
.navy .lead{color:var(--on-navy-soft)}
.body{font-size:.97em;line-height:2;color:var(--text)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:52px;padding:0 28px;border-radius:999px;font-size:.94em;font-weight:700;border:1px solid transparent;white-space:nowrap;transition:transform .2s var(--ease),background-color .2s,color .2s,border-color .2s;cursor:pointer}
.btn-navy{background:var(--btn-navy-bg);color:var(--btn-navy-fg)}
.btn-white{background:#fff;color:var(--p)}
.btn-soft{background:var(--blue-100);color:var(--heading)}
.btn-line-w{border-color:rgba(255,255,255,.45);color:#fff}
.btn.sm{height:44px;padding:0 20px;font-size:.88em}
.btn .ic{width:18px;height:18px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cat{display:inline-flex;align-items:center;width:max-content;align-self:flex-start;font-size:.8em;font-weight:700;color:var(--blue);background:var(--blue-100);padding:4px 10px;border-radius:999px}
.imgph{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--soft);color:var(--muted);font-size:.85em;background-image:repeating-linear-gradient(135deg,transparent 0 10px,rgba(0,0,0,.03) 10px 11px)}
.imgph .ic{width:22px;height:22px;opacity:.6}

/* ---------- reveal motion ---------- */
.anim .rv{opacity:0;transform:translateY(14px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.anim .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.anim .rv{opacity:1;transform:none;transition:none}}

/* ---------- header ---------- */
.header{position:sticky;top:calc(env(safe-area-inset-top,0px) - 14px + var(--spbar-h));z-index:40;padding-top:14px;margin-top:14px;margin-bottom:-14px}
.header .bar{background:var(--card);border-radius:999px;height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;box-shadow:var(--shadow);gap:12px;transition:background-color .3s}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.08em;color:var(--heading);padding-inline-start:8px;min-width:0}
.brand span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mark{width:44px;height:44px;border-radius:50%;background:var(--p);display:grid;place-items:center;color:#fff;flex:none;overflow:hidden}
.mark img{width:100%;height:100%;object-fit:cover}
.nav{display:flex;gap:2px}
.nav a{padding:10px 15px;font-size:.94em;font-weight:500;color:var(--text);border-radius:999px;transition:background-color .2s,color .2s;white-space:nowrap}
.nav a.on{color:var(--heading);background:var(--blue-100);font-weight:700}
.hdr-end{display:flex;align-items:center;gap:8px}
.tt{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--heading);background:var(--soft);transition:background-color .2s}
.tt .ic{width:20px;height:20px}
html.dark .tt .moon,html:not(.dark) .tt .sun{display:none}
.burger{display:none;width:44px;height:44px;border-radius:50%;place-items:center;color:var(--heading);background:var(--soft)}
.mnav{display:none}
.mnav.open{display:block;background:var(--card);border-radius:var(--r-lg);margin-top:10px;padding:10px;box-shadow:var(--shadow)}
.mnav a{display:block;padding:13px 16px;border-radius:var(--r-sm);font-weight:600;color:var(--ink)}
.mnav a.on{background:var(--blue-100);color:var(--heading)}
.mnav .btn{width:100%;margin-top:8px}

/* ---------- hero (panoramic, immersive) ----------
   Image opacity  : --hero-img-o  (0-1, written by applyTheme from theme.heroImgOpacity; applies to the image layer ONLY)
   Image -> text blend: --hero-bg / --hero-dir + the ::after overlay and the mask on the image (independent of the opacity above) */
.panel.hero{
  --hero-bg:var(--card);
  --hero-dir:to right;
  /* fade geometry: written by applyTheme from theme.heroFadePos / heroFadeHard (h* = side-by-side layout, v* = stacked layout) */
  --f0:var(--hero-h0,26.5%);--fm:var(--hero-hm,42.5%);--f1:var(--hero-h1,69%);
  --hero-haze:color-mix(in srgb,var(--blue) 22%,var(--hero-bg)); /* tone the image dissolves through (keeps the blend blue, not grey) */
  position:relative;isolation:isolate;overflow:hidden;
  display:grid;grid-template-columns:minmax(0,.92fr) minmax(0,1.08fr);align-items:center;
  min-height:540px;padding:0;background:var(--hero-bg);
}
html.dark .panel.hero{--hero-bg:color-mix(in srgb,var(--card) 72%,#050B16);--hero-haze:color-mix(in srgb,var(--blue) 10%,var(--hero-bg))}
html.dark .chip{background:var(--soft);box-shadow:0 0 0 1px var(--line),0 18px 40px -18px rgba(0,0,0,.7)}
.hero-body{position:relative;z-index:2;padding:72px 56px 72px 24px}
.hero h1{font-size:clamp(2.05em,3.3vw,2.9em);line-height:1.5;font-weight:800;color:var(--heading);margin-top:10px}
.hero .lead{margin-top:20px;max-width:30em}
.hero .small{margin-top:10px;font-size:.92em;color:var(--muted);max-width:36em;line-height:1.9}
.hero-cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.hero .btn-soft{background:transparent;border-color:color-mix(in srgb,var(--blue) 50%,transparent);color:var(--heading)}
.hero-visual{position:absolute;inset:0;z-index:0}
.hero-visual .himg,.hero-visual .imgph{
  position:absolute;inset:0;width:100%;height:100%;aspect-ratio:auto;border-radius:0;object-fit:cover;object-position:left center;
  opacity:var(--hero-img-o,.85);
  -webkit-mask-image:linear-gradient(var(--hero-dir),#000 0,#000 var(--f0),rgba(0,0,0,.6) var(--fm),transparent var(--f1));
          mask-image:linear-gradient(var(--hero-dir),#000 0,#000 var(--f0),rgba(0,0,0,.6) var(--fm),transparent var(--f1));
}
html.dark .hero-visual .himg{filter:brightness(.92) saturate(.92)}
.hero-visual::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(var(--hero-dir),transparent 0,transparent var(--f0),color-mix(in srgb,var(--hero-haze) 55%,transparent) var(--fm),var(--hero-bg) var(--f1))}
.chip{position:absolute;left:28px;bottom:28px;z-index:3;max-width:calc(100% - 56px);background:var(--card);border-radius:999px;padding:10px 18px 10px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 18px 40px -18px color-mix(in srgb,var(--p) 40%,transparent)}
.chip i{width:40px;height:40px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;flex:none}
html.dark .chip i{background:var(--a);color:var(--on-accent)}
.chip b{display:block;font-size:.9em;color:var(--ink)}
.chip span{font-size:.76em;color:var(--muted)}
.chip2{position:absolute;left:28px;top:56px;z-index:3;background:var(--blue);color:var(--on-accent);border-radius:999px;padding:10px 18px;font-size:.88em;font-weight:700;box-shadow:0 18px 40px -18px color-mix(in srgb,var(--p) 50%,transparent)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.stat{background:var(--card);border-radius:var(--r-lg);padding:26px 28px;display:flex;align-items:center;gap:18px;position:relative;transition:background-color .3s}
.stat .n{font-size:2.2em;font-weight:800;color:var(--heading);line-height:1;display:flex;align-items:baseline;gap:2px}
.stat .n small{font-size:.5em;color:var(--blue)}
.stat .l{font-size:.88em;color:var(--muted);line-height:1.6}

/* ---------- about ---------- */
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:center}
.about .body{margin-top:20px;max-width:36em}
.tags{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.tag{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--soft);font-size:.88em;font-weight:600;color:var(--heading);position:relative}
.tag .ic{width:16px;height:16px;color:var(--blue);stroke-width:2.4}
/* about highlights: slight lift; the border draw comes from the shared card-frame system */
.about .tag{transition:transform .35s var(--ease)}
.about .tag:focus-visible{outline:none;transform:translateY(-3px)}
@media (prefers-reduced-motion:reduce){.about .tag{transition:none}.about .tag:hover,.about .tag:focus-visible{transform:none!important}}
.about-visual{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}
.about-visual .av{position:relative;border-radius:var(--r-lg);overflow:hidden;min-height:150px}
.about-visual .av img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.about-visual .av .imgph{position:absolute;inset:0}
.about-visual .big{grid-row:1/3;min-height:360px}
.about-visual .card{background:var(--panel-navy);color:#fff;border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;justify-content:flex-end;position:relative} /* position:relative = the animated frame (::after, inset:0) must be anchored to THIS card, not to the whole about panel */
.about-visual .card b{font-size:2.1em;line-height:1}
.about-visual .card span{font-size:.8em;color:var(--sky);margin-top:6px}

/* ---------- services ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:40px}
.svc{background:var(--card);border-radius:var(--r-lg);padding:28px 26px 30px;position:relative;transition:transform .25s var(--ease),background-color .3s}
.tile{width:54px;height:54px;border-radius:50%;background:var(--blue-100);color:var(--heading);display:grid;place-items:center;overflow:hidden}
.tile .ic{width:24px;height:24px}
.tile img{width:28px;height:28px;object-fit:contain}
.svc h3{font-size:1.08em;line-height:1.6;font-weight:700;margin-top:20px}
.svc p{font-size:.9em;line-height:1.9;color:var(--text);margin-top:8px}

/* ---------- process ---------- */
.track{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:40px}
.tstep{background:var(--navy-cell);border-radius:var(--r-lg);padding:26px 24px;position:relative}
.tstep .no{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 14px;border-radius:999px;background:#fff;color:var(--p);font-weight:800;font-size:.86em}
.tstep h3{font-size:1.05em;font-weight:700;margin-top:18px}
.tstep p{font-size:.88em;line-height:1.9;color:var(--on-navy-soft);margin-top:8px}

/* ---------- portfolio cards (home) ---------- */
.pf{background:var(--card);border-radius:var(--r-lg);padding:12px 12px 22px;position:relative;transition:transform .25s var(--ease),background-color .3s;display:flex;flex-direction:column}
.pf .thumb{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden}
.pf .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .6s var(--ease)}
.pf .thumb .imgph{position:absolute;inset:0}
.pf .in{padding:16px 10px 0;display:flex;flex-direction:column;flex:1}
.pf h3{font-size:1.05em;line-height:1.6;font-weight:700;margin-top:12px}
.pf p{font-size:.88em;line-height:1.85;color:var(--text);margin-top:6px}
.pf .more{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:.88em;font-weight:700;color:var(--blue)}
.pf .more .ic{width:16px;height:16px}

/* ---------- clients ---------- */
.clients{background:var(--card);border-radius:var(--r-lg);padding:28px 40px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;transition:background-color .3s}
.clients .t{font-size:.88em;font-weight:700;color:var(--muted)}
.logos{display:flex;gap:36px;flex-wrap:wrap;align-items:center}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;color:#9AA3B2;font-size:.98em;position:relative}
.logo i{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;overflow:hidden;flex:none}
.logo img{max-height:44px;max-width:150px;object-fit:contain;filter:grayscale(1);opacity:.8;transition:filter .25s,opacity .25s}
.logo:hover img{filter:none;opacity:1}

/* ---------- contact ---------- */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.contact .lead{margin-top:16px}
.c-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.c-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.c-cell{transition:transform .2s ease,background-color .25s;background:var(--navy-cell);border-radius:var(--r);padding:20px;position:relative;color:#fff}
.c-cell .ico{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--p);display:grid;place-items:center;overflow:hidden}
.c-cell .ico img{width:22px;height:22px;object-fit:contain}
.c-cell .lbl{font-size:.8em;color:rgba(255,255,255,.6);margin-top:16px}
.c-cell .val{font-size:.95em;font-weight:600;margin-top:4px;word-break:break-word}
.social{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.social a,.social .soc{width:46px;height:46px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.35);color:#fff;transition:background-color .2s;position:relative}
.social img{width:22px;height:22px;object-fit:contain}

/* ---------- footer ---------- */
.footer{padding:40px 0 28px}
.f-grid{display:grid;grid-template-columns:1.5fr 1fr 1.2fr;gap:48px}
.f-note{margin-top:16px;font-size:.88em;line-height:1.95;color:var(--text);max-width:26em}
.f-title{font-size:.88em;font-weight:800;color:var(--heading);margin-bottom:16px}
.f-links{display:grid;gap:10px;font-size:.88em;color:var(--text)}
.f-links li{display:flex;align-items:flex-start;gap:8px}
.f-links .ic{width:16px;height:16px;color:var(--blue);margin-top:4px}
.f-bottom{margin-top:36px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.8em;color:var(--muted)}
.f-bottom button{display:inline-flex;align-items:center;gap:6px;opacity:.7}
.to-top{position:fixed;bottom:22px;right:22px;z-index:30;width:46px;height:46px;border-radius:50%;background:var(--card);color:var(--heading);box-shadow:var(--shadow);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .25s}
.to-top.show{opacity:1;pointer-events:auto}
body.admin-open .to-top{bottom:90px}

/* ---------- inner pages ---------- */
.crumbs{display:flex;align-items:center;gap:8px;font-size:.8em;color:var(--muted);margin-bottom:18px;flex-wrap:wrap}
.crumbs .cur{color:var(--heading);font-weight:600}
.crumbs .ic{width:14px;height:14px;opacity:.6}
.ph{padding-bottom:40px}
.ph-row{display:flex;align-items:flex-end;justify-content:space-between;gap:32px;flex-wrap:wrap}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:28px}
.filter{cursor:pointer;height:42px;padding:0 18px;border-radius:999px;background:var(--soft);color:var(--text);font-size:.88em;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background-color .2s,color .2s}
.filter.on{background:var(--p);color:#fff}
.filter small{font-size:.86em;opacity:.7}
.rows{display:grid;gap:16px}
.row{background:var(--card);border-radius:var(--r-xl);padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;position:relative;transition:background-color .3s}
.row .rimg{position:relative;aspect-ratio:16/10;border-radius:var(--r-lg);overflow:hidden}
.row .rimg img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.row .rimg .imgph{position:absolute;inset:0}
.row .in{padding:12px 12px 12px 4px;display:flex;flex-direction:column;align-items:flex-start}
.row h3{font-size:1.5em;line-height:1.5;font-weight:800;color:var(--heading);margin-top:12px}
.row p{font-size:.94em;line-height:1.95;color:var(--text);margin-top:10px;max-width:34em}
.kv{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.kv span{display:inline-flex;gap:6px;padding:8px 14px;border-radius:999px;background:var(--soft);font-size:.82em;color:var(--text);position:relative;align-items:center}
.kv span b{color:var(--ink);font-weight:700}
.row .btn{margin-top:22px}
.more-row{display:flex;justify-content:center;margin-top:24px}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
/* project page */
.cover{position:relative;border-radius:var(--r-xl);overflow:hidden;background:var(--card);padding:12px}
.cover .cimg{position:relative;aspect-ratio:21/9;border-radius:var(--r-lg);overflow:hidden}
.cover .cimg img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.cover .cimg .imgph{position:absolute;inset:0}
.two{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;align-items:start}
.panel.txt{padding:40px 44px}
.panel.txt h2{font-size:1.25em;font-weight:800;color:var(--heading)}
.panel.txt .body{margin-top:14px;white-space:pre-line}
.ml{white-space:pre-line}
.facts{background:var(--card);border-radius:var(--r-xl);padding:28px 30px;transition:background-color .3s}
.facts h2{font-size:1.05em;font-weight:800;color:var(--heading);margin-bottom:8px}
.fr{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:.9em;position:relative;align-items:center}
.fr:last-of-type{border:0}
.fr span{color:var(--muted)}
.fr b{color:var(--ink);font-weight:700;text-align:left}
.facts .btn{width:100%;margin-top:18px}
.gal-head{display:flex;align-items:center;justify-content:space-between;margin:8px 4px 14px;gap:12px;flex-wrap:wrap}
.gal-head h2{font-size:1.25em;font-weight:800;color:var(--heading)}
.gal-head span{font-size:.85em;color:var(--muted)}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gi{position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--card);padding:8px;transition:background-color .3s}
.gi .gm{position:relative;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;background:#000}
.gi .gm img,.gi .gm video,.gi .gm iframe{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border:0}
.gi.wide{grid-column:span 2}.gi.wide .gm{aspect-ratio:8/3}
.gi .gm.lb{cursor:zoom-in}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:16px}

.navopt:focus-visible,.navsel h3 button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.navopt i,.navi{width:38px;height:38px;border-radius:12px;background:var(--blue-100);color:var(--heading);display:grid;place-items:center;font-style:normal;font-weight:800;flex:none;overflow:hidden;box-sizing:border-box}
.navi img{width:100%;height:100%;object-fit:contain;display:block}
.navopt i .ic,.navi .ic{width:60%;height:60%;color:var(--heading)}
.navico-sec{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.navico-sec h4{margin:0 0 4px;font-size:.98em;font-weight:800;color:var(--heading)}
.navico-row{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:var(--r);margin-top:10px}
.navico-row>.navi{width:46px;height:46px}
.navico-main{flex:1;min-width:0;display:grid;gap:8px}
.navico-main .mrow{margin:0;flex-wrap:wrap}
.navico-main [hidden]{display:none!important}
.navico-main .btn{height:38px;padding:0 14px;font-size:.84em}
.navico-frm{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:.82em;color:var(--text)}
.navico-frm label{display:inline-flex;align-items:center;gap:6px}
.navico-frm select{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 8px}
.navico-frm input[type=range]{width:110px}
.navopt span{flex:1;display:grid;gap:2px}
.navopt b{font-size:.95em}
.navopt small{color:var(--muted);font-size:.78em}
.navopt .ic{width:16px;height:16px;color:var(--muted)}
@media(max-width:560px){.navsel-bg{align-items:flex-end;padding:8px}}
.f-edit-addr{display:flex;gap:8px;align-items:flex-start}
.f-edit-addr>span{display:block;min-width:0}
/* modal */
.modal-bg{position:fixed;inset:0;z-index:85;background:rgba(5,10,20,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .2s}
.modal{background:var(--card);color:var(--ink);border-radius:22px;padding:24px;width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:pop .25s var(--ease)}
.modal.wide{max-width:680px}
.modal h3{font-size:1.1em;font-weight:800;color:var(--heading);display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal h3 button{width:36px;height:36px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.modal .desc{font-size:.86em;color:var(--muted);margin-top:6px;line-height:1.8}
.fld{display:grid;gap:6px;margin-top:14px;font-size:.88em;color:var(--text)}
.fld input[type=text],.fld input[type=password],.fld input[type=url],.fld textarea,.fld select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card);color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s}
.fld textarea{height:auto;min-height:120px;padding:12px 14px;resize:vertical;font-family:ui-monospace,monospace;font-size:12.5px;direction:ltr}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
.fld .err{color:#B91C1C;font-size:.85em}
.mrow{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.mrow .btn{height:46px;padding:0 20px;font-size:.9em}
.btn-danger{background:#FEE2E2;color:#B91C1C}
html.dark .btn-danger{background:rgba(185,28,28,.25);color:#FCA5A5}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border:0}
.srow .t{font-size:.92em;font-weight:600}
.srow .d{font-size:.8em;color:var(--muted);margin-top:2px}
.switch{position:relative;width:44px;height:26px;border-radius:999px;background:#CBD2DC;transition:background .25s;flex:none}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--blue)}.switch.on::after{transform:translateX(-18px)}
.swatch{display:flex;align-items:center;gap:10px}
.swatch input[type=color]{-webkit-appearance:none;appearance:none;width:40px;height:40px;border:none;border-radius:10px;padding:0;cursor:pointer;background:none}
.swatch input[type=color]::-webkit-color-swatch-wrapper{padding:0;border-radius:10px}
.swatch input[type=color]::-webkit-color-swatch{border:1px solid var(--line);border-radius:10px}
.swatch code{font-size:12px;color:var(--muted);direction:ltr}
/* ----- font picker / custom font upload (admin settings) ----- */
.fontbox{padding:13px 0;border-bottom:1px solid var(--line)}
.fontbox>.t{font-size:.92em;font-weight:600}
.fontbox>.d,.ff-note{font-size:.8em;color:var(--muted);margin-top:2px;line-height:1.8}
.ff-list{display:grid;gap:8px;margin-top:10px}
.ff-item{display:flex;align-items:stretch;gap:4px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);transition:border-color .2s,background-color .2s}
.ff-item.on{border-color:var(--blue);background:var(--blue-100)}
.ff-pick{flex:1;min-width:0;display:grid;gap:3px;padding:10px 13px;text-align:start}
.ff-name{font-size:.82em;font-weight:700;color:var(--heading);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ff-name small{font-weight:500;color:var(--muted);font-size:.9em}
.ff-prev{font-size:1.05em;line-height:1.7;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ff-del{flex:none;display:inline-flex;align-items:center;gap:5px;padding:0 13px;font-size:.78em;font-weight:700;color:#dc2626;border-radius:var(--r)}
.ff-del:hover{background:rgba(220,38,38,.09)}
.ff-prevbox{margin-top:16px}
.ff-prevbox>.t{font-size:.92em;font-weight:600;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ff-prevbox>.t small{font-weight:500;color:var(--muted)}
.ff-site{margin-top:10px;border:1px solid var(--line);border-radius:var(--r-lg,16px);background:var(--page);padding:18px;display:grid;gap:14px;overflow:hidden}
.ff-site .fs-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--card);border-radius:999px;padding:8px 10px}
.ff-site .fs-nav span{font-size:.86em;font-weight:500;color:var(--text);padding:6px 10px}
.ff-site .fs-nav span.on{background:var(--blue-100);color:var(--heading);font-weight:700;border-radius:999px}
.ff-site .h2{font-size:1.5em;margin:0}
.ff-site .stats{grid-template-columns:repeat(3,1fr);gap:10px}
.ff-site .stat{padding:14px;gap:10px}
.ff-site .stat .n{font-size:1.6em}
.ff-site .fs-card{background:var(--card);border-radius:var(--r-lg,16px);padding:16px}
.ff-site .fs-card h4{margin:0;font-size:1.02em;font-weight:700;color:var(--heading)}
.ff-site .fs-card p{margin:6px 0 0;font-size:.88em;line-height:1.9;color:var(--text)}
.ff-pick:focus-visible,.ff-del:focus-visible{outline:2px solid var(--blue);outline-offset:-2px}
.ff-add{margin-top:12px;display:grid;gap:8px;justify-items:start}
.ff-pend{width:100%;border:1px dashed var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.ff-lbl{display:grid;gap:5px;font-size:.8em;color:var(--text)}
.ff-pend input[type=text],.ff-pend select{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:var(--card);color:var(--ink);width:100%;min-width:0}
.ff-file{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.ff-file b{display:block;font-size:.8em;direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ff-file small{display:block;font-size:.74em;color:var(--muted);line-height:1.7}
.ff-file small.warn{color:#b45309}
.ff-file select{width:auto;min-width:140px}
.ff-pend .mrow{margin-top:0}
.ff-pend .mrow .btn{height:42px;padding:0 16px;font-size:.86em}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:999px;font-size:.84em;color:var(--text);font-weight:600}
.seg button.on{background:var(--card);color:var(--heading);box-shadow:0 1px 3px rgba(0,0,0,.1)}
input[type=range].slider{width:160px;accent-color:var(--blue)}
.expbox{border:0;margin:0;padding:13px 0;border-bottom:1px solid var(--line);min-width:0}
.expbox legend{padding:0 0 8px;font-size:.92em;font-weight:600}
.expopt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;margin-top:8px;cursor:pointer}
.expopt input{margin-top:5px;accent-color:var(--blue);flex:none}
.expopt b{display:block;font-size:.92em}.expopt small{display:block;margin-top:3px;font-size:.8em;line-height:1.8;color:var(--muted)}
.expopt:has(input:checked){border-color:var(--blue);background:var(--blue-100)}
.expopt:has(input:focus-visible){outline:2px solid var(--blue);outline-offset:2px}
.hop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hop-prev{height:64px;border-radius:var(--r-sm);overflow:hidden;background:var(--hero-bg,var(--card));border:1px solid var(--line);margin:2px 0 10px}
.hop-prev img{width:100%;height:100%;object-fit:cover;object-position:left center}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px;align-items:start}
.preset{border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;justify-items:center;font-size:11.5px;color:var(--text)}
.preset:hover{border-color:var(--blue)}
.preset i{display:block;width:100%;height:26px;border-radius:7px}
.pfam{position:relative;display:grid;gap:6px}
.pfam .preset{width:100%}
.preset.on,.pv.on{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.preset.on{background:var(--blue-100);color:var(--heading);font-weight:700}
.pfam-t{position:absolute;top:12px;inset-inline-end:12px;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.4)}
.pfam-t::after{content:"";position:absolute;inset:-6px}
.pfam-t:hover{background:rgba(255,255,255,.36)}
.pfam-t .ic{width:14px;height:14px;transition:transform .2s var(--ease)}
.pfam-t[aria-expanded="true"] .ic{transform:rotate(180deg)}
.pfam-t::before{content:"";position:absolute;top:-4px;inset-inline-start:-4px;width:9px;height:9px;border-radius:50%;background:var(--blue);border:2px solid #fff;display:none}
.pfam.has-on .pfam-t[aria-expanded="false"]::before{display:block}
.pfam-v{display:grid;gap:4px}
.pfam-v[hidden]{display:none}
.pfam-cap{font-size:10.5px;color:var(--muted);padding:0 2px}
.pv{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:5px 7px;font-size:11px;color:var(--text);text-align:start}
.pv:hover{border-color:var(--blue)}
.pv.on{color:var(--heading);font-weight:700;background:var(--blue-100)}
.pv i{flex:none;width:26px;height:14px;border-radius:5px}
.pv span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:reduce){.pfam-t .ic{transition:none}}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:95;background:#0F172A;color:#fff;padding:11px 18px;border-radius:999px;font-size:.88em;font-weight:600;box-shadow:0 18px 40px -12px rgba(0,0,0,.5);animation:pop .25s var(--ease);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.err{background:#B91C1C}
.hintbox{font-size:.8em;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px;line-height:1.8;margin-top:10px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:none}}
.admin-edit .sec-off{opacity:.45;outline:2px dashed #B91C1C;outline-offset:-2px}
.offlabel{position:absolute;top:10px;right:16px;z-index:5;background:#B91C1C;color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px}
.sec-wrapper{position:relative}

/* ===== v2 additions ===== */
/* theme switch: the page is swapped once and cross-faded as a whole (View Transitions); per-element transitions are frozen meanwhile.
   (Animating colours on ~400 elements at once made the text shimmer and the header jump.) */
html.theme-vt *,html.theme-vt *::before,html.theme-vt *::after{transition:none!important}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s;animation-timing-function:ease-out}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
/* header: hover (temporary) and active (current section) are separate */
.header .nav a{position:relative}
.header .nav a.on{background:transparent;color:var(--heading);font-weight:700}
.header .nav a.on::after{content:"";position:absolute;inset-inline:14px;bottom:3px;height:3px;border-radius:3px;background:var(--a)}
.mnav a.on{box-shadow:inset 3px 0 0 var(--a)}
/* brand logo */
.mark.has-logo{width:auto;height:auto;background:none;border-radius:0;overflow:visible}
.mark.has-logo img{height:var(--logo-h,44px);width:auto;max-width:180px;object-fit:contain;border-radius:0;transform:translateY(var(--logo-y,0px))}
.mark-edit{display:inline-flex;position:relative;border-radius:12px;cursor:pointer;outline:1px dashed color-mix(in srgb,var(--blue) 65%,transparent);outline-offset:4px;transition:outline-color .2s}
.mark-edit:hover,.mark-edit:focus-visible{outline:2px solid var(--blue)}
.mark-pen{position:absolute;top:-8px;inset-inline-start:-8px;width:20px;height:20px;border-radius:50%;background:var(--blue);color:var(--on-accent);display:grid;place-items:center;opacity:0;transition:opacity .15s;pointer-events:none}
.mark-pen .ic{width:11px;height:11px}
.mark-edit:hover .mark-pen,.mark-edit:focus-visible .mark-pen{opacity:1}
@media (hover:none){.mark-pen{opacity:1}}
html.dark .mark.has-logo.backed img{background:#fff;border-radius:8px;box-shadow:0 0 0 3px #fff,-3px 0 0 3px #fff,3px 0 0 3px #fff} /* halo instead of padding: toggling the theme must not resize the logo/header */
@media (max-width:640px){.mark.has-logo img{height:min(var(--logo-h,44px),44px);max-width:120px}}
.lg-prev{margin-top:14px;border:1px solid var(--line);border-radius:999px;padding:10px 14px;background:var(--card)}
/* clients */
.cl-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.cl-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.cl-card{position:relative;margin:0;border-radius:var(--r);flex:0 0 calc(20% - 8px);min-height:128px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--line);text-align:center;outline:none;transition:background-color .2s,border-color .2s,box-shadow .2s}
.cl-logo{display:flex;align-items:center;justify-content:center;height:54px;max-width:100%}
.cl-logo img{max-width:min(110px,100%);max-height:54px;width:auto;height:auto;object-fit:contain;filter:grayscale(1);opacity:.85;transition:filter .2s,opacity .2s}
.cl-name{font-size:.84em;font-weight:600;color:var(--text);line-height:1.7;transition:color .2s}
.cl-card:focus-visible{z-index:2;background:var(--blue-100);border-color:var(--p);box-shadow:0 0 0 1px var(--p),0 16px 30px -16px color-mix(in srgb,var(--p) 45%,transparent)}
.cl-card:focus-visible .cl-logo img{filter:none;opacity:1}
.cl-card:focus-visible .cl-name{color:var(--p)}
html.dark .cl-card:focus-visible{background:color-mix(in srgb,var(--a) 12%,#fff);border-color:var(--sky);box-shadow:0 0 0 1px var(--sky),0 16px 30px -16px rgba(0,0,0,.7)}
@media (prefers-reduced-motion:reduce){.cl-card,.cl-logo img{transition:none}}
.catsel{border:0;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer;max-width:220px}
.catsel option{color:#1B2430;background:#fff}
.cm-row{display:flex;align-items:center;gap:8px;margin-top:10px}
.cm-row input{flex:1;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--card);color:var(--ink)}
.cm-row small{color:var(--muted);white-space:nowrap}
.cl-grid-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cl-edit{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;align-content:start}
.cl-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cl-lab{font-size:.84em;font-weight:700;color:var(--heading)}
.cl-tools{display:flex;gap:6px}
.cl-ic{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--heading);background:var(--card)}
.cl-ic.del{color:#B91C1C}

/* ===== hover system =====
   Two independent layers decide whether a decorative hover effect shows:
   1) DEVICE  - every hover effect sits inside (hover:hover) and (pointer:fine), so a touchscreen can never enter a hover/"sticky hover" state while scrolling or tapping;
   2) SETTING - html[data-hv-off~="id"] (written from D.hover by applyHover(), edited in Admin > هاورها) switches ONE group off; groups never affect each other.
   Keyboard focus, :active and tap behaviour are never gated by the setting. */
@media (hover:hover) and (pointer:fine){
  /* header + navigation */
  html:not([data-hv-off~="header"]) #app .header .nav a:hover{background:var(--soft);color:var(--heading)}
  html:not([data-hv-off~="header"]) #app .tt:hover{background:var(--blue-100)}
  /* buttons: hero */
  html:not([data-hv-off~="hero-btn"]) #app .hero .btn:hover{transform:translateY(-1px)}
  html:not([data-hv-off~="hero-btn"]) #app .hero .btn.btn-navy:hover{background:color-mix(in srgb,var(--btn-navy-bg) 88%,#000)}
  html:not([data-hv-off~="hero-btn"]) #app .hero .btn.btn-soft:hover{background:var(--blue-100)}
  html:not([data-hv-off~="hero-btn"]) #app .hero .btn.btn-line-w:hover{background:rgba(255,255,255,.1)}
  /* buttons: everywhere else (+ gallery download buttons) */
  html:not([data-hv-off~="btn"]) #app .btn:not(.hero .btn):hover{transform:translateY(-1px)}
  html:not([data-hv-off~="btn"]) #app .btn:not(.hero .btn).btn-navy:hover{background:color-mix(in srgb,var(--btn-navy-bg) 88%,#000)}
  html:not([data-hv-off~="btn"]) #app .btn:not(.hero .btn).btn-soft:hover{background:var(--blue-200)}
  html:not([data-hv-off~="btn"]) #app .btn:not(.hero .btn).btn-line-w:hover{background:rgba(255,255,255,.1)}
  html:not([data-hv-off~="btn"]) #app .gi-dl:hover{border-color:var(--blue);color:var(--blue)}
  html:not([data-hv-off~="btn"]) .lightbox .lb-dl:hover{background:rgba(255,255,255,.28)}
  html:not([data-hv-off~="btn"]) .lightbox .lb-nav:hover{background:rgba(255,255,255,.28)}
  /* about tags: lift (reduced-motion keeps its own override above) */
  html:not(.admin-edit):not([data-hv-off~="about"]) .about .tag:hover{transform:translateY(-3px)}
  /* portfolio image zoom */
  html:not([data-hv-off~="pf-img"]) .pf:hover .thumb img{transform:scale(1.03)}
  /* customer cards */
  html:not([data-hv-off~="clients"]) .cl-card:hover{z-index:2;background:var(--blue-100);border-color:var(--p);box-shadow:0 0 0 1px var(--p),0 16px 30px -16px color-mix(in srgb,var(--p) 45%,transparent)}

const idb = {

    return new Promise((res, rej) => {

      r.onsuccess = () => res(r.result);

  },

  async del(k) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(true); t.onerror = () => rej(t.error); }); },

function initDark() {
  try { localStorage.setItem('site_dark_default', D.theme.darkDefault || 'system'); } catch (e) { /* ignore */ } /* read by the first-paint script on the next load */
  let pref = null;
  try { pref = localStorage.getItem(THEME_KEY); } catch (e) { /* ignore */ }
  let dark;
  if (pref === 'dark' || pref === 'light') dark = pref === 'dark';
  else if (D.theme.darkDefault === 'dark') dark = true;
  else if (D.theme.darkDefault === 'system') dark = matchMedia('(prefers-color-scheme: dark)').matches;
  else dark = false;
  document.documentElement.classList.toggle('dark', dark);
}
let themeWant = null;
function toggleDark() {
  const root = document.documentElement;
  const v = !(themeWant !== null ? themeWant : root.classList.contains('dark')); /* rapid double clicks stay consistent */
  themeWant = v;
  try { localStorage.setItem(THEME_KEY, v ? 'dark' : 'light'); } catch (e) { /* ignore */ }
  const swap = () => { root.classList.toggle('dark', v); applyTheme(); $$('.tt').forEach((b) => b.setAttribute('aria-pressed', String(v))); };
  const done = () => { if (themeWant === v) themeWant = null; root.classList.remove('theme-vt'); };
  root.classList.add('theme-vt');
  if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const vt = document.startViewTransition(swap);
    vt.finished.then(done, done);
  } else { swap(); void root.offsetWidth; requestAnimationFrame(() => requestAnimationFrame(done)); } /* no animation: instant, never a half-way state */
}

/* ---------- toast ---------- */
let toastTimer = null;
function toast(msg, err) {
  $$('.toast').forEach((t) => t.remove());
  const el = document.createElement('div'); el.className = 'toast' + (err ? ' err' : ''); el.textContent = msg; document.body.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), err ? 4200 : 2400);
}

/* custom text size/colour is keyed by path (…media.N.caption); keep it attached to its image when media are moved or removed */
function reindexMediaStyles(listPath, mapIdx) {
  if (!/\.media$/.test(listPath || '')) return; const st = A.get('styles'); if (!st) return;
  const re = new RegExp('^' + listPath.replace(/\./g, '\\.') + '\\.(\\d+)\\.(.+)$'), moved = [];
  Object.keys(st).forEach((k) => { const m = re.exec(k); if (m) { moved.push([m[1], m[2], st[k]]); delete st[k]; } });
  moved.forEach(([n, rest, v]) => { const ni = mapIdx(+n); if (ni != null) st[`${listPath}.${ni}.${rest}`] = v; });
}

    if (n.length < 8) return fail('رمز جدید باید حداقل ۸ کاراکتر باشد.');
    if (n !== n2) return fail('تکرار رمز یکسان نیست.');
    await setPw(n); closeModal(); toast('رمز مدیر تغییر کرد.');
  };
}

window.__ADMIN__ = { init() { renderBar(); }, renderBar };
})();

</script>
